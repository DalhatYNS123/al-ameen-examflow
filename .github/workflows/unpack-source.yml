name: Unpack EXAMFLOW source package

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.EXAMFLOW_UPLOAD_TOKEN }}

      - name: Extract the uploaded source ZIP safely
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          import glob
          import sys

          archives = glob.glob("*.zip")

          if len(archives) != 1:
              sys.exit(f"Expected exactly one ZIP in repository root; found {len(archives)}")

          archive = Path(archives[0])
          written = 0

          with ZipFile(archive) as zf:
              for member in zf.infolist():
                  if member.is_dir():
                      continue

                  raw = PurePosixPath(member.filename)
                  parts = raw.parts

                  if not parts or raw.is_absolute() or ".." in parts:
                      sys.exit(f"Unsafe ZIP path: {member.filename}")

                  relative = Path(*parts[1:]) if len(parts) > 1 else Path(parts[0])

                  if not str(relative) or str(relative) == ".":
                      continue

                  if "__MACOSX" in relative.parts:
                      continue

                  destination = Path(".") / relative
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(zf.read(member))
                  written += 1

          print(f"Extracted {written} files from {archive.name}")
          PY

      - name: Commit extracted project files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No extracted changes to commit."
          else
            git commit -m "Extract EXAMFLOW v3.5.6 installation source"
            git push
          fi
