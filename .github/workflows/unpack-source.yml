name: Unpack EXAMFLOW source package

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
  uses: actions/checkout@v4
  with:
    token: ${{ secrets.EXAMFLOW_UPLOAD_TOKEN }}

      - name: Extract the uploaded source ZIP safely
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          import glob

          archives = glob.glob("*.zip")
          if len(archives) != 1:
              raise SystemExit(f"Expected exactly one ZIP in repository root; found {len(archives)}: {archives}")

          archive = Path(archives[0])
          with ZipFile(archive) as zf:
              members = [m for m in zf.infolist() if not m.is_dir()]
              written = 0
              for member in members:
                  raw = PurePosixPath(member.filename)
                  parts = raw.parts
                  if not parts or raw.is_absolute() or ".." in parts:
                      raise SystemExit(f"Unsafe ZIP path: {member.filename}")
                  # Remove the package's enclosing top-level folder.
                  relative = Path(*parts[1:]) if len(parts) > 1 else Path(parts[0])
                  if str(relative) in ("", ".") or "__MACOSX" in relative.parts:
                      continue
                  destination = Path(".") / relative
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(zf.read(member))
                  written += 1

          print(f"Extracted {written} files from {archive.name}")
          PY

      - name: Commit extracted project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No extracted changes to commit."
          else
            git commit -m "Extract EXAMFLOW v3.5.6 installation source"
            git push
          fi
